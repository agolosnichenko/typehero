principles:
  - en: "Keep your fingers on the home row and return to it after every reach."
    ru: "Держи пальцы на домашнем ряду и возвращайся к нему после каждого движения."
  - en: "Accuracy first — speed follows. Don't trade your error rate for pace."
    ru: "Сначала точность — скорость придёт следом. Не меняй точность на темп."
  - en: "Don't look at the keys. Let your fingers learn the path by feel."
    ru: "Не смотри на клавиши. Пусть пальцы запоминают путь на ощупь."
  - en: "Each key has one finger. Always reach with the same finger for the same key."
    ru: "У каждой клавиши свой палец. Всегда тянись к клавише одним и тем же пальцем."
  - en: "A steady rhythm beats fast bursts. Even pace builds lasting speed."
    ru: "Ровный темп лучше рывков. Постоянный ритм даёт стойкую скорость."
  - en: "Relax your hands and wrists. Tension slows you down and tires you out."
    ru: "Расслабь кисти и запястья. Напряжение замедляет и утомляет."
  - en: "Short daily practice beats rare long sessions. Consistency wins."
    ru: "Короткие ежедневные занятия лучше редких длинных. Побеждает регулярность."
  - en: "Fix mistakes calmly with backspace; don't panic and don't race to catch up."
    ru: "Исправляй ошибки спокойно через backspace; не паникуй и не гонись наверстать."
