[project]
name = "typehero"
version = "0.1.0"
description = "Console touch-typing trainer with gamification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anton Golosnichenko", email = "anton@golosnichenko.com" }]
keywords = ["typing", "touch-typing", "trainer", "tui", "cli", "gamification"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pyyaml==6.0.3",
    "textual==8.2.7",
]

[project.urls]
Homepage = "https://github.com/agolosnichenko/typehero"
Repository = "https://github.com/agolosnichenko/typehero"
Issues = "https://github.com/agolosnichenko/typehero/issues"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "hypothesis==6.155.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.16",
    "ty==0.0.43",
]

[build-system]
requires = ["uv_build>=0.5.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "typehero"

[project.scripts]
typehero = "typehero.tui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
