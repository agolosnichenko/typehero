[project]
name = "typehero"
version = "0.1.0"
description = "Console touch-typing trainer with gamification"
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "textual==8.2.7",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "hypothesis==6.155.1",
    "pytest-asyncio==1.4.0",
    "ty==0.0.43",
]

[build-system]
requires = ["uv_build>=0.5.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "typehero"

[project.scripts]
typehero = "typehero.tui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
